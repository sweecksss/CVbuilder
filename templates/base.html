<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мої резюме{% endblock %} · CV Builder</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @layer components {
            .btn { @apply inline-flex min-h-11 items-center justify-center gap-2 rounded-xl px-5 py-2.5 text-sm font-semibold transition-colors cursor-pointer; }
            .btn-primary { @apply bg-blue-600 text-white hover:bg-blue-700; }
            .btn-secondary { @apply border border-slate-200 bg-white text-slate-700 hover:bg-slate-50; }
            .btn-danger { @apply bg-red-600 text-white hover:bg-red-700; }
            .panel { @apply rounded-2xl border border-slate-200 bg-white p-6 sm:p-8; }
            .section-title { @apply text-lg font-semibold tracking-tight text-slate-900; }
            .muted { @apply text-sm leading-6 text-slate-500; }
            .text-link { @apply inline-flex min-h-11 items-center text-sm font-semibold text-blue-700 hover:underline; }
            .resume-form p { @apply mb-5; }
            .resume-form label { @apply mb-2 block text-sm font-medium text-slate-700; }
            .resume-form input:not([type=checkbox]):not([type=hidden]), .resume-form textarea, .resume-form select { @apply block w-full rounded-xl border border-slate-300 bg-white px-3 py-3 text-base text-slate-900 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100; }
            .resume-form textarea { @apply min-h-32 resize-y; }
            .resume-form input[type=file] { @apply text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-blue-50 file:px-3 file:py-2 file:text-blue-700; }
            .resume-form .helptext { @apply mt-2 block text-sm text-slate-500; }
            .resume-form .errorlist { @apply mb-3 rounded-lg bg-red-50 p-3 text-sm text-red-700; }
        }
        @layer base { a:focus-visible, button:focus-visible { @apply outline-2 outline-offset-4 outline-blue-600; } }
    </style>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
    <a href="#content" class="sr-only focus:not-sr-only">Перейти до вмісту</a>
    <header class="border-b border-slate-200 bg-white">
        <nav aria-label="Головна навігація" class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-5 py-5 sm:px-8">
            <a href="{% url 'resume_list' %}" class="flex items-center gap-3 text-lg font-bold tracking-tight">CV Builder</a>
            <div class="flex flex-wrap items-center gap-3 sm:gap-5">
                {% if user.is_authenticated %}
                    <a href="{% url 'resume_list' %}" class="text-link">Мої резюме</a>
                    <a href="{% url 'profile' %}" class="text-link">Мій профіль</a>
                    <span class="max-w-36 truncate text-sm text-slate-500">{{ user.username }}</span>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-secondary">Вийти</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-secondary">Увійти</a>
                    <a href="{% url 'register' %}" class="btn btn-primary">Зареєструватися</a>
                {% endif %}
            </div>
        </nav>
    </header>
    <main id="content" class="mx-auto max-w-6xl px-5 py-10 sm:px-8 sm:py-14">
        {% block content %}{% endblock %}
    </main>
    <footer class="mx-auto max-w-6xl px-5 pb-8 text-xs text-slate-500 sm:px-8">CV Builder · Наступний крок у вашій кар’єрі</footer>
</body>
</html>
