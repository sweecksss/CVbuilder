{% extends "base.html" %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
<section class="panel mx-auto max-w-md">
    <h1 class="mb-6 text-2xl font-bold">Реєстрація</h1>

    <form method="post" class="resume-form">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary w-full">
            Зареєструватись
        </button>
    </form>
</section>
{% endblock %}
